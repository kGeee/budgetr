# XcodeGen spec — generates Budgetr.xcodeproj from this declarative file.
# Regenerate any time with:  cd apple && xcodegen generate
# (Install once:  brew install xcodegen)
name: Budgetr
options:
  bundleIdPrefix: com.budgetr
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # The real team — same one the Expo companion signs with (mobile/app.json),
    # so both apps belong to one account. This was a placeholder matching no
    # certificate on this machine, which is why the project would only build
    # with signing switched off entirely.
    #
    # Automatic signing needs Xcode to be signed in (Xcode > Settings >
    # Accounts). Until it is, build with scripts/build-mac.sh, which signs
    # ad-hoc — enough to run locally, since the entitlements are sandbox +
    # network only.
    DEVELOPMENT_TEAM: "B9UFFWUAD8"

targets:
  Budgetr:
    type: application
    # One target, both platforms (Xcode multiplatform app).
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Budgetr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetr.app
        PRODUCT_NAME: Budgetr
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Budgetr/Support/Budgetr.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Budgetr
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.finance"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # INFOPLIST_KEY_UIBackgroundModes: "remote-notification"  # restore when CloudKit re-enabled

  BudgetrTests:
    type: bundle.unit-test
    # macOS only: these cover the pure domain layer (MonthSummary, BudgetPacing,
    # CategoryMapping), which has no platform dependencies — so running them on
    # one destination proves them for both, and the suite stays fast enough to
    # run on every build.
    supportedDestinations: [macOS]
    # Compiles the domain sources directly instead of hosting the app. The app
    # is sandboxed, and a sandboxed ad-hoc-signed host hangs before the test
    # runner can connect — but none of this code needs an app: it is pure value
    # types over Foundation. Anything touching Core Data belongs in a separate
    # hosted suite, once there is something worth hosting for.
    sources:
      - path: Tests
      - path: Budgetr/Domain/MonthSummary.swift
      - path: Budgetr/Domain/BudgetPacing.swift
      - path: Budgetr/Domain/CategoryMapping.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.budgetr.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Budgetr:
    build:
      targets:
        Budgetr: all
        BudgetrTests: [test]
    test:
      targets: [BudgetrTests]
      gatherCoverageData: false
